Ctrl+1 script-message mympv-quality original
Ctrl+2 script-message mympv-quality cinema
Ctrl+3 script-message mympv-quality anime
i script-binding display-stats
I script-binding display-stats-toggle
p script-binding uosc/playlist
b script-binding uosc/open-file
Alt+s script-binding uosc/subtitles
Alt+Shift+s cycle secondary-sid
Q quit-watch-later
# 鼠标右键打开 uosc 菜单
MBTN_RIGHT script-binding uosc/menu